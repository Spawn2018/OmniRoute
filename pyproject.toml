[project]
name = "omniroute"
version = "0.1.0"
description = "Wielodostępna platforma spedycyjna"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14",
    "asyncpg>=0.30",
    "email-validator>=2.2",
    "fastapi>=0.115",
    "granian>=1.6",
    "openfga-sdk>=0.9",
    "pendulum>=3.0",
    "psycopg2-binary>=2.9",
    "argon2-cffi>=23.1",
    "pyjwt>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0",
    "openpyxl>=3.1.5",
    "xlrd>=2.0.1",
]

[project.optional-dependencies]
dev = [
    "hypothesis>=6.122",
    "httpx>=0.28",
    "import-linter>=2.1",
    "mypy>=1.14",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "pip-audit>=2.7",
    "ruff>=0.8",
    "types-xlrd>=1.0",
    "types-openpyxl>=3.1",
]
ai = [
    "instructor>=1.7",
    "openai>=1.40",
]
parsers = [
    "docling>=2.0",
]
obs = [
    "langfuse>=2.0,<3",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["backend"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["backend"]
# Lokalne ASGI CORS (sales mock) — nie produkt; równoległy proces potrafi je odtworzyć
extend-exclude = ["backend/asgi_cors.py", "backend/app/main_cors.py", "backend/local"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "BLE", "C901"]

[tool.ruff.lint.per-file-ignores]
"backend/app/api/**" = ["B008"]
"backend/alembic/**" = ["I001"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["app"]
mypy_path = "backend"
plugins = []

[[tool.mypy.overrides]]
module = ["alembic.*", "openfga_sdk", "openfga_sdk.*", "instructor", "instructor.*", "openai", "openai.*", "llm_guard", "llm_guard.*", "docling", "docling.*", "langfuse", "langfuse.*", "argon2", "argon2.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["app.integrations.openfga.*"]
disallow_untyped_calls = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["backend/tests"]
pythonpath = ["backend"]
markers = [
    "integration: wymaga PostgreSQL",
]

[tool.coverage.run]
branch = true
source = ["app"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_empty = true
