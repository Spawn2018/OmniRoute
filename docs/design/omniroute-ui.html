<!DOCTYPE html>
<html lang="pl" data-theme="light" data-density="compact">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>OmniRoute — podgląd sprzedażowy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Makieta. Nie bundel Vite. Nie ruszać frontend/. */
:root {
  --s1: 4px; --s2: 6px; --s3: 8px; --s4: 12px; --s5: 16px; --s6: 24px;
  --r: 12px; --r-sm: 8px; --r-pill: 999px;
  --fs-xs: 11px; --fs-sm: 12.5px; --fs: 14px; --fs-md: 16px; --fs-lg: 22px; --fs-xl: 28px;
  --row-h: 32px; --pad-y: 6px;
  --rail: 3.35rem; --rail-open: 13.75rem; --insp: 19.5rem; --top: 3rem;
  --sans: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, monospace;
  --cond: "IBM Plex Sans Condensed", "IBM Plex Sans", sans-serif;
  --ink: oklch(.2 .04 165);
  --on-ink: oklch(.97 .01 165);
  --canvas: oklch(.955 .014 165);
  --surface: oklch(.995 .004 165);
  --surface-2: oklch(.975 .01 165);
  --surface-3: oklch(.945 .018 165);
  --rule: oklch(.9 .02 165);
  --rule-2: oklch(.82 .03 165);
  --text: oklch(.23 .03 165);
  --text-2: oklch(.42 .03 165);
  --text-3: oklch(.54 .025 165);
  --accent: oklch(.42 .11 165);
  --accent-2: oklch(.52 .12 165);
  --accent-soft: oklch(.94 .05 165);
  --ok: oklch(.44 .11 165);
  --ok-soft: oklch(.94 .05 165);
  --alert: oklch(.48 .11 62);
  --alert-tint: oklch(.972 .028 78);
  --alert-line: oklch(.74 .14 70);
  --stop: oklch(.52 .19 25);
  --focus: oklch(.42 .12 165);
  --lift: 0 1px 2px oklch(.22 .03 165 / .06), 0 10px 28px oklch(.22 .03 165 / .1);
  --scrim: oklch(.2 .03 165 / .42);
  color-scheme: light;
}
[data-theme="dark"] {
  --ink: oklch(.16 .03 165);
  --on-ink: oklch(.95 .015 165);
  --canvas: oklch(.15 .02 165);
  --surface: oklch(.22 .025 165);
  --surface-2: oklch(.26 .028 165);
  --surface-3: oklch(.3 .03 165);
  --rule: oklch(.34 .03 165);
  --rule-2: oklch(.42 .035 165);
  --text: oklch(.94 .015 165);
  --text-2: oklch(.76 .02 165);
  --text-3: oklch(.64 .02 165);
  --accent: oklch(.78 .11 165);
  --accent-2: oklch(.72 .11 165);
  --accent-soft: oklch(.3 .05 165);
  --ok: oklch(.76 .11 165);
  --ok-soft: oklch(.3 .05 165);
  --alert: oklch(.83 .12 78);
  --alert-tint: oklch(.28 .045 72);
  --alert-line: oklch(.66 .13 70);
  --stop: oklch(.7 .16 25);
  --focus: oklch(.8 .1 165);
  --lift: 0 1px 2px oklch(0 0 0 / .4), 0 14px 36px oklch(0 0 0 / .45);
  --scrim: oklch(.08 .02 165 / .55);
  color-scheme: dark;
}
[data-density="comfortable"] { --row-h: 40px; --pad-y: 9px; --fs: 14.5px; }
[data-grid="condensed"] .grid { font-family: var(--cond); --row-h: 24px; --pad-y: 3px; --fs-xs: 10.5px; }
*, *::before, *::after { box-sizing: border-box; }
html {
  overflow-x: auto;
  overflow-y: auto;
  -webkit-text-size-adjust: 100%;
}
body {
  margin: 0; font: var(--fs)/1.4 var(--sans); background: var(--canvas); color: var(--text);
  min-height: 100dvh; overflow-x: auto; overflow-y: auto;
  -webkit-font-smoothing: antialiased; overflow-wrap: anywhere;
}
button, select, input { font: inherit; color: inherit; }
button { background: none; border: 0; cursor: pointer; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: var(--r-sm); }
svg { display: block; }
.app {
  min-height: 100dvh; width: 100%; max-width: 100%;
}
.rail {
  background: var(--ink); color: var(--on-ink); display: flex; flex-direction: column;
  align-items: center; gap: var(--s2); padding: var(--s3) 0 env(safe-area-inset-bottom);
  position: fixed; left: 0; top: 0; bottom: 0; width: var(--rail); height: 100dvh; z-index: 30;
  overflow-x: hidden; overflow-y: auto; transition: width 160ms ease;
}
.app.rail-open { --rail: var(--rail-open); }
.app.rail-open .rail { align-items: stretch; padding: var(--s3) var(--s2) env(safe-area-inset-bottom); }
.rail-grp {
  display: none; font-size: 9px; letter-spacing: .08em; text-transform: uppercase;
  color: color-mix(in oklch, var(--on-ink) 42%, transparent); padding: var(--s3) var(--s3) 0; margin: 0;
}
.app.rail-open .rail-grp { display: block; }
.rail .lbl { display: none; font-size: 12px; font-weight: 500; white-space: nowrap; text-align: left; }
.app.rail-open .rail .lbl { display: block; }
.mark {
  width: 2rem; height: 2rem; margin: var(--s2) 0 var(--s3); border-radius: var(--r-sm);
  background: oklch(.72 .12 165); color: oklch(.16 .04 165);
  display: grid; place-items: center; font-weight: 600;
}
.rail button.mark {
  width: 2rem; height: 2rem; color: oklch(.16 .04 165);
}
.app.rail-open .rail button.mark { width: 2rem; height: 2rem; margin-inline: auto; grid-template-columns: none; }
.rail button, .rail a {
  width: 2.35rem; height: 2.35rem; display: grid; place-items: center; border-radius: var(--r-sm);
  color: color-mix(in oklch, var(--on-ink) 72%, transparent); position: relative; flex-shrink: 0;
}
.app.rail-open .rail button, .app.rail-open .rail a {
  width: 100%; height: 2.2rem; grid-template-columns: 1.4rem 1fr; justify-items: start;
  align-items: center; gap: var(--s2); padding: 0 var(--s3);
}
.rail button[aria-current="page"] { background: color-mix(in oklch, var(--on-ink) 14%, transparent); color: var(--on-ink); }
.rail svg { width: 1.15rem; height: 1.15rem; }
.rail .sp { flex: 1; }
.who { width: 1.85rem; height: 1.85rem; border-radius: 50%; background: color-mix(in oklch, var(--on-ink) 16%, transparent); display: grid; place-items: center; font-size: 10px; font-weight: 600; }
.shell { display: flex; flex-direction: column; min-width: 0; min-height: 100dvh; flex: 1; margin-left: var(--rail); }
.top {
  display: flex; align-items: center; flex-wrap: wrap; gap: var(--s3); padding: var(--s3) var(--s4);
  background: var(--surface); border-bottom: 1px solid var(--rule); min-width: 0;
  position: sticky; top: 0; z-index: 15;
}
.top select {
  border: 1px solid var(--rule-2); border-radius: var(--r-sm); background: var(--surface-2);
  min-height: 2rem; padding: 0 var(--s3); max-width: 11rem;
}
.crumb { font-size: var(--fs-sm); color: var(--text-2); min-width: 0; }
.nav-back {
  min-height: 2rem; min-width: 2rem; padding: 0 var(--s2); display: inline-flex; align-items: center; gap: var(--s1);
  border: 1px solid var(--rule-2); border-radius: var(--r-sm); background: var(--surface-2); color: var(--text-2);
  font-size: var(--fs-xs); font-weight: 500;
}
.nav-back:hover:not(:disabled) { background: var(--surface-3); color: var(--text); }
.nav-back:disabled { opacity: .38; cursor: not-allowed; }
.nav-back svg { width: 14px; height: 14px; flex-shrink: 0; }
.crumb b { color: var(--text); font-weight: 500; }
.omni {
  flex: 1; min-width: 8rem; display: flex; align-items: center; gap: var(--s2);
  min-height: 2rem; padding: 0 var(--s4); border: 1px solid var(--rule);
  border-radius: var(--r-pill); background: var(--surface-2); color: var(--text-3); font-size: var(--fs-sm);
}
.omni kbd { margin-left: auto; font: 500 10px/1 var(--mono); border: 1px solid var(--rule-2); padding: 2px 5px; border-radius: 4px; }
.tools { display: flex; gap: var(--s2); margin-inline-start: auto; }
.icb {
  min-height: 2rem; padding: 0 var(--s3); border: 1px solid var(--rule-2);
  border-radius: var(--r-sm); background: var(--surface-2); color: var(--text-2); font-size: var(--fs-xs);
}
.icb[aria-pressed="true"] { background: var(--ink); color: var(--on-ink); border-color: var(--ink); }
.avatar { width: 1.85rem; height: 1.85rem; border-radius: 50%; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; font-size: 10px; font-weight: 600; }
.body { display: block; min-width: 0; flex: 1; }
.body.no-insp .work { margin-right: 0; }
.work { min-width: 0; overflow: visible; margin-right: var(--insp); }
.insp {
  background: var(--surface); border-left: 1px solid var(--rule); min-width: 0;
  overflow: auto; padding: 0; position: fixed; top: var(--top); right: 0; bottom: 0;
  width: var(--insp); z-index: 25;
}
.view { display: none; min-height: 0; }
.view.on { display: block; }
.pad { padding: var(--s5); max-width: 92rem; margin-inline: auto; width: 100%; }
.xscroll {
  overflow-x: auto; overflow-y: visible; max-width: 100%;
  -webkit-overflow-scrolling: touch; overscroll-behavior-x: contain;
}
table.lines, table.grid { width: 100%; border-collapse: collapse; min-width: 36rem; }
.card {
  background: var(--surface); border-radius: var(--r); box-shadow: var(--lift);
  border: 1px solid color-mix(in oklch, var(--rule) 70%, transparent); padding: var(--s5); min-width: 0;
}
.h-id { font-size: var(--fs-xs); color: var(--text-3); margin: 0 0 var(--s2); }
.h-route { font-size: var(--fs-lg); font-weight: 600; letter-spacing: -.02em; margin: 0 0 var(--s2); }
.loc { font-family: var(--mono); font-size: var(--fs-sm); color: var(--text-2); font-weight: 400; }
.banner .loc { color: oklch(.9 .02 165); opacity: .92; }
.note { font-size: var(--fs-xs); color: var(--text-3); margin: 0; }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 12rem), 1fr)); gap: var(--s4); margin-bottom: var(--s5); }
.kpi { padding: var(--s5); }
.kpi dt { font-size: var(--fs-xs); letter-spacing: .06em; text-transform: uppercase; color: var(--text-3); margin: 0 0 var(--s2); }
.kpi dd { margin: 0; font-size: var(--fs-xl); font-weight: 600; font-variant-numeric: tabular-nums; letter-spacing: -.03em; }
.spark { height: 28px; margin-top: var(--s3); }
.spark path { fill: none; stroke: var(--accent-2); stroke-width: 1.6; }
.pages { display: grid; grid-template-columns: repeat(auto-fit, minmax(7.5rem, 1fr)); gap: var(--s3); margin-bottom: var(--s5); }
.page {
  min-height: 5.5rem; border-radius: var(--r); padding: var(--s4); color: oklch(.18 .03 165);
  display: flex; flex-direction: column; justify-content: flex-end; font-weight: 600; font-size: var(--fs-sm); text-align: left;
}
.page small { font-weight: 400; opacity: .8; font-size: var(--fs-xs); }
.todo { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: var(--s3); align-items: start; padding: var(--s4) 0; border-bottom: 1px solid var(--rule); }
.todo:last-child { border-bottom: 0; }
.todo .meta { display: grid; grid-template-columns: 1fr 1fr; gap: 2px var(--s4); font-size: var(--fs-xs); color: var(--text-2); margin-top: var(--s2); }
.linkish { color: var(--accent); font-weight: 500; font-size: var(--fs-sm); }
.linkish.stop { color: var(--stop); }
.btn {
  display: inline-flex; align-items: center; gap: var(--s2); min-height: 2rem; padding: 0 var(--s4);
  border: 1px solid var(--rule-2); border-radius: var(--r-sm); background: var(--surface); font-weight: 500; font-size: var(--fs-sm);
}
.btn-p { background: var(--ink); color: var(--on-ink); border-color: var(--ink); }
.btn[aria-disabled="true"] { color: var(--text-3); border-style: dashed; cursor: not-allowed; }
.cmd { display: flex; flex-wrap: wrap; gap: var(--s2); padding: var(--s3) var(--s5); background: var(--surface); border-bottom: 1px solid var(--rule); overflow-x: auto; max-width: 100%; }
.banner {
  margin: var(--s4) var(--s5) 0; border-radius: var(--r); padding: var(--s5) var(--s6);
  background: linear-gradient(120deg, oklch(.32 .06 165), oklch(.42 .1 165));
  color: oklch(.97 .01 165); max-width: calc(100% - 2 * var(--s5));
}
.facts {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(7.5rem, 1fr));
  border-top: 1px solid var(--rule); margin: 0;
}
.facts.n4 { grid-template-columns: repeat(4, minmax(7.5rem, 1fr)); }
.facts.n5 { grid-template-columns: repeat(5, minmax(7.5rem, 1fr)); }
.facts.n6 { grid-template-columns: repeat(6, minmax(7.5rem, 1fr)); }
  .facts.n7 { grid-template-columns: repeat(7, minmax(7.5rem, 1fr)); }
  .facts.n8 { grid-template-columns: repeat(8, minmax(7rem, 1fr)); }
.party-split { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(16rem, .9fr); gap: var(--s4); align-items: start; }
.party-panel { padding: var(--s4); }
.party-panel h3 { margin: 0 0 var(--s3); font-size: var(--fs-sm); }
.party-panel .row { display: grid; grid-template-columns: 7rem 1fr; gap: var(--s2); font-size: var(--fs-sm); padding: 4px 0; border-bottom: 1px solid var(--rule); }
.party-panel .row:last-child { border-bottom: 0; }
.party-panel .row span:first-child { color: var(--text-3); font-size: var(--fs-xs); text-transform: uppercase; letter-spacing: .04em; }
.hitl-body { display: grid; grid-template-columns: 1fr 1fr; gap: 0; min-height: 0; }
.hitl-body > div { border-right: 1px solid var(--rule); }
.hitl-body > div:last-child { border-right: 0; }
@media (max-width: 52rem) {
  .party-split, .hitl-body { grid-template-columns: 1fr; }
  .hitl-body > div { border-right: 0; border-bottom: 1px solid var(--rule); }
}
.fact { padding: var(--s3) var(--s2); border-right: 1px solid var(--rule); min-width: 0; text-align: center; }
.fact:last-child { border-right: 0; }
.fact dt { font-size: 10.5px; text-transform: uppercase; letter-spacing: .05em; color: var(--text-3); margin-bottom: 2px; }
.fact dd { font-size: var(--fs); font-weight: 500; margin: 0; display: flex; flex-direction: column; align-items: center; }
.fact dd small { display: block; font-weight: 400; color: var(--text-2); font-size: var(--fs-xs); margin-top: 1px; }
.num { font-variant-numeric: tabular-nums lining-nums; }
.facts-wrap { box-shadow: none; padding: 0; overflow-x: auto; -webkit-overflow-scrolling: touch; }
.tabs { display: flex; gap: 0; padding: 0 var(--s5); background: var(--surface); border-bottom: 1px solid var(--rule); overflow-x: auto; max-width: 100%; -webkit-overflow-scrolling: touch; }
.tabs button { min-height: 2.5rem; padding: 0 var(--s4); color: var(--text-2); border-bottom: 2px solid transparent; white-space: nowrap; flex-shrink: 0; }
.tabs button[aria-selected="true"] { color: var(--text); border-bottom-color: var(--accent); font-weight: 500; }
.pane { display: none; padding: var(--s5); }
.pane.on { display: block; }
.chan { display: inline-flex; align-items: center; gap: var(--s2); font-size: var(--fs-xs); padding: 4px 8px; border-radius: var(--r-pill); background: var(--surface-2); margin-right: var(--s2); }
.chan .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--text-3); }
.chan.done .dot { background: var(--ok); }
.chan.err .dot { background: var(--stop); }
.v { border-radius: var(--r); box-shadow: var(--lift); background: var(--surface); margin-bottom: var(--s4); overflow: clip; border: 1px solid transparent; }
.v.best { outline: 1px solid color-mix(in oklch, var(--ok) 45%, transparent); }
.v.picked { outline: 2px solid var(--accent); }
.vh { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: var(--s4); width: 100%; text-align: left; padding: var(--s4) var(--s5); min-width: 0; }
.vb { display: none; border-top: 1px solid var(--rule); }
.v.open .vb { display: block; }
.chip { display: inline-flex; align-items: center; min-height: 1.2rem; padding: 0 7px; border-radius: 6px; font-size: 10px; font-weight: 500; letter-spacing: .03em; text-transform: uppercase; background: var(--surface-3); color: var(--text-2); }
.chip.ok { background: var(--ok-soft); color: var(--ok); }
.chip.alert { background: var(--alert-tint); color: var(--alert); }
.chip.stop { background: color-mix(in oklch, var(--stop) 16%, var(--surface)); color: var(--stop); }
.mval { display: inline-grid; grid-template-columns: auto auto auto; font-variant-numeric: tabular-nums; font-family: var(--mono); white-space: nowrap; }
.mval .f { color: var(--text-2); }
.cur { color: var(--text-3); font-size: .8em; padding-left: .3ch; }
.mval.lg { font-size: var(--fs-md); font-weight: 500; }
.mval.down { color: var(--stop); }
.mval.down .f { color: color-mix(in oklch, var(--stop) 65%, var(--text-2)); }
.fact-warn { color: var(--alert-line); font-weight: 500; }
.fact-ok { color: var(--ok); font-weight: 500; }
.fact-stop { color: var(--stop); font-weight: 500; }
.ship-banner-top { display: flex; align-items: flex-start; justify-content: space-between; gap: var(--s4); }
.ship-banner-top .btn {
  flex-shrink: 0; background: color-mix(in oklch, var(--on-ink) 10%, transparent);
  border-color: color-mix(in oklch, var(--on-ink) 22%, transparent); color: inherit;
}
.ship-kpi-tools {
  display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between;
  gap: var(--s3); padding: var(--s3) var(--s4); border-bottom: 1px solid var(--rule); background: var(--surface-2);
}
.ship-kpi-tools .note { margin: 0; }
.ship-kpis-board { overflow-x: auto; -webkit-overflow-scrolling: touch; }
.ship-kpis {
  display: grid; margin: 0; min-width: 0;
}
.ship-kpis .fact {
  text-align: center; padding: var(--s3) var(--s2); border-right: 1px solid var(--rule);
  border-bottom: 1px solid var(--rule); display: flex; flex-direction: column; justify-content: center;
  min-height: 4.5rem; min-width: 6.5rem;
}
.ship-kpis .fact.row-end { border-right: 0; }
.ship-kpis .fact.last-row { border-bottom: 0; }
.ship-kpis .fact.fin { min-height: 6.75rem; }
.ship-kpis .fact dd { display: flex; flex-direction: column; align-items: center; justify-content: center; flex: 1; margin: 0; gap: 1px; }
.ship-kpis .fact dd small { display: block; font-weight: 400; color: var(--text-2); font-size: var(--fs-xs); margin-top: 1px; }
.ship-kpis .fact dt { text-align: center; margin-bottom: var(--s1); flex-shrink: 0; }
.ship-kpis .val.mono { font-family: var(--mono); letter-spacing: -.01em; }
.ship-kpis .val { font-weight: 600; font-size: var(--fs-sm); line-height: 1.25; }
.view-modal {
  width: min(28rem, 94vw); background: var(--surface); border-radius: var(--r);
  box-shadow: var(--lift); overflow: clip; border: 1px solid var(--rule);
}
.view-modal .vm-head { padding: var(--s4) var(--s5); border-bottom: 1px solid var(--rule); }
.view-modal .vm-head h2 { margin: 0 0 var(--s1); font-size: var(--fs-md); font-weight: 600; }
.view-modal .vm-body { padding: var(--s4) var(--s5); max-height: min(52vh, 28rem); overflow: auto; }
.view-modal .vm-foot {
  display: flex; flex-wrap: wrap; gap: var(--s2); justify-content: flex-end;
  padding: var(--s3) var(--s5); border-top: 1px solid var(--rule); background: var(--surface-2);
}
.view-modal .vm-legend {
  margin: 0 0 var(--s4); padding: var(--s3); border-radius: var(--r-sm);
  background: var(--surface-2); border: 1px solid var(--rule); font-size: var(--fs-xs); color: var(--text-2);
}
.view-modal .vm-legend b { color: var(--text); font-weight: 500; }
.vm-row {
  display: flex; align-items: center; gap: var(--s2); padding: var(--s2) var(--s3);
  border: 1px solid var(--rule); border-radius: var(--r-sm); background: var(--surface);
  margin-bottom: var(--s2); cursor: grab; user-select: none;
}
.vm-row:last-child { margin-bottom: 0; }
.vm-row.dragging { opacity: .55; }
.vm-row.drag-over { outline: 2px solid var(--accent); outline-offset: 1px; }
.vm-grip { color: var(--text-3); font-size: 14px; letter-spacing: -.05em; line-height: 1; padding: 0 2px; }
.vm-row label { display: flex; flex: 1; align-items: center; gap: var(--s2); font-size: var(--fs-sm); cursor: pointer; }
.vm-row input { accent-color: var(--accent); }
.kform { display: grid; gap: var(--s3); }
.kf { display: grid; gap: 3px; font-size: var(--fs-sm); }
.kf span { font-size: 10.5px; text-transform: uppercase; letter-spacing: .05em; color: var(--text-3); }
.kf input, .kf select, .kf textarea {
  min-height: 2rem; border: 1px solid var(--rule-2); border-radius: var(--r-sm);
  background: var(--surface-2); padding: var(--s2) var(--s3); width: 100%;
}
.kf textarea { min-height: 6rem; resize: vertical; }
.kerr { color: var(--stop); font-size: var(--fs-sm); margin: 0; }

  return `<span class="mval ${cls || ""}"><span>${int}</span><span class="f">${fra}</span><span class="cur">${currency}</span></span>`;
}

const FREE_TIME_THRESHOLDS = { okAbove: 7, stopAt: 2 };
function freeTimeTone(days) {
  if (typeof days !== "number" || Number.isNaN(days)) return { tone: "warn", cls: "fact-warn", label: "—" };
  if (days < 0) return { tone: "stop", cls: "fact-stop", label: `przeterminowane ${Math.abs(days)} d` };
  if (days <= FREE_TIME_THRESHOLDS.stopAt) return { tone: "stop", cls: "fact-stop", label: days === 0 ? "upływa dziś" : `upływa za ${days} dni` };
  if (days <= FREE_TIME_THRESHOLDS.okAbove) return { tone: "warn", cls: "fact-warn", label: `upływa za ${days} dni` };
  return { tone: "ok", cls: "fact-ok", label: `upływa za ${days} dni` };
}
function freeTimeSev(days) {

}

      e.dataTransfer.effectAllowed = "move";
      e.dataTransfer.setData("text/plain", shipDragId);
    });
    row.addEventListener("dragend", () => {
      row.classList.remove("dragging");
      list.querySelectorAll(".vm-row").forEach((r) => r.classList.remove("drag-over"));
      shipDragId = null;
    });
    row.addEventListener("dragover", (e) => {
      e.preventDefault();
      row.classList.add("drag-over");
    });
    row.addEventListener("dragleave", () => row.classList.remove("drag-over"));
    row.addEventListener("drop", (e) => {
      e.preventDefault();
      row.classList.remove("drag-over");
      const from = shipDragId || e.dataTransfer.getData("text/plain");
      const to = row.dataset.id;
      if (!from || !to || from === to || !shipHeaderDraft) return;
      const order = shipHeaderDraft.order.slice();
      const fi = order.indexOf(from);
      const ti = order.indexOf(to);
      if (fi < 0 || ti < 0) return;
      order.splice(fi, 1);
      order.splice(ti, 0, from);
      shipHeaderDraft.order = order;
      paintShipHeaderEditor();
    });
  });

    inp.addEventListener("change", () => {
      if (!shipHeaderDraft) return;
      shipHeaderDraft.visibility[inp.getAttribute("data-vis")] = inp.checked;
    });
  });

function drawPal(q) {
  const qq = q.toLowerCase();
  const nav = [
    { g: "Nawigacja", i: "Dzień", a: () => go("home") },
    { g: "Nawigacja", i: "Wyceny", a: () => go("quote") },
    { g: "Nawigacja", i: "Stawki", a: () => go("rates") },

    { g: "Nawigacja", i: "Porty", a: () => go("ports") },

    { g: "Nawigacja", i: "Oferty kanału", a: () => go("channels") },

    { g: "Nawigacja", i: "Użytkownicy", a: () => go("users") },
    { g: "Akcje", i: "Skan QR paczki", a: () => { go("ship"); setTimeout(() => document.querySelector("[data-act='scan-pkg']")?.click(), 0); } },
    { g: "Akcje", i: "Akceptuj szkic HITL", a: () => { go("hitl"); toast("Fokus na Accept — potwierdzenie recenzenta."); } },
    { g: "Rekordy", i: "ZAP/2026/00318", a: () => go("quote") }
  ];
  const mods = (window.OR_CATALOG || []).map((m) => ({ g: "Moduły", i: m.id + " " + m.name, a: () => goMod(m.id) }));
  const all = nav.concat(mods).filter((c) => !qq || c.i.toLowerCase().includes(qq));
  all.sort((a, b) => {
    const idA = a.i.split(" ")[0].toLowerCase();
    const idB = b.i.split(" ")[0].toLowerCase();
    const rank = (id) => (id === qq ? 0 : id.startsWith(qq) ? 1 : 2);
    return rank(idA) - rank(idB);
  });
  let g = ""; let h = "";
  all.slice(0, 40).forEach((c, i) => {
    if (c.g !== g) { g = c.g; h += `<div class="pgrp">${g}</div>`; }
    h += `<div class="pit" data-i="${i}" role="option">${c.i}</div>`;
  });
  $("#palRes").innerHTML = h || "<div class='pgrp'>Brak</div>";
  drawPal._list = all.slice(0, 40);
  $$(".pit").forEach((e) => e.addEventListener("click", () => { const c = drawPal._list[+e.dataset.i]; pal(false); if (c) c.a(); }));
}

  if (a === "ship-stakeholders") {

  if (a === "stake-add") {

        { id: "party_id", label: "party_id", required: true, placeholder: "kontrahent" },
        { id: "source_ref", label: "source_ref", required: true, value: "fixture://shipment-stakeholder/7" }
      ],
      validate: (d) => d.party_id ? "" : "409 · party_id wymagane.",

    });
    return;
  }
  if (a === "stake-mail") {
    OR_KERNEL.mail({
      to: "ops@andescargo.pe",
      subject: `${SHIP_META.ref} · strony zlecenia`,
      body: "Proszę o party_id dla client_customs. Bez niego wiersz nie wchodzi."
    });
    return;
  }
  if (a === "ship-booking") {
    const rows = BOOKING_ROWS.map((b) => ({ k: b.booking_scope, v: `${b.target_role} · ${bookingStatusOf(b)}` }));
    OR_KERNEL.detail({
      title: "booking_instruction · I4",

      rows,
      actions: [
        { act: "booking-accept", label: "Accept ocean" },
        { act: "booking-mail", label: "Szkic maila" }
      ]
    });
    return;
  }
  if (a === "booking-accept") {
    OR_KERNEL.confirm({
      title: "Accept booking_instruction",
      note: "HITL. Status dane, nie wysyłka do armatora.",
      text: "ocean → ocean_carrier · suggested. Zaakceptować instrukcję?",

      onAccept: () => {
        bookingOceanStatus = "accepted";
        if (current === "ship") { paintShip(); setInsp(shipInspHtml(), true); }
        toast("Booking ocean = accepted. Nie S21.");
      }
    });
    return;
  }
  if (a === "booking-mail") {
    OR_KERNEL.mail({
      to: "api@hlag.com",

  if (a === "ship-stops") {
    OR_KERNEL.detail({
      title: "stop · T1",

      rows: STOPS.map((s) => ({ k: `#${s.sequence_no} ${s.stop_kind}`, v: `${s.location} · ${s.time_zone} · ${s.status}` })),
      actions: [{ act: "stop-add", label: "Dodaj stop" }]
    });
    return;
  }
  if (a === "stop-add") {
    OR_KERNEL.form({
      title: "Nowy stop",
      note: "Miejsce ze słownika. time_zone IANA. Nie mapa.",
      requireSource: true,
      fields: [
        { id: "stop_kind", label: "stop_kind", type: "select", required: true, options: ["loading", "unloading", "customs", "ferry", "terminal", "depot", "other"], value: "depot" },
        { id: "location", label: "location", required: true, value: "Gdynia BCT" },
        { id: "time_zone", label: "time_zone", required: true, value: "Europe/Warsaw" },
        { id: "sequence_no", label: "sequence_no", required: true, value: "5" },
        { id: "source_ref", label: "source_ref", required: true, value: "fixture://stop/5" }
      ],
      onSave: () => toast("Stop w sesji. Nie mapa.")
    });
    return;
  }
  if (a === "scan-pkg") {
    if (current !== "ship") go("ship");
    OR_KERNEL.form({
      title: "Skan QR Omni · shipment_package",
      note: "Token omni://shipment-package/{kod} albo fixture://omni-qr/{kod}. Inny kod = odrzut. Stop z tej trasy.",
      requireSource: true,
      fields: [
        { id: "package_code", label: "package_code", required: true, value: "pkg_mex_001" },
        { id: "scan_token", label: "scan_token", required: true, value: "omni://shipment-package/pkg_mex_001" },
        { id: "stop", label: "stop z trasy", type: "select", required: true, options: STOPS.map((s) => `${s.sequence_no} · ${s.stop_kind} · ${s.location}`), value: "2 · terminal · Gdynia BCT" },
        { id: "package_status", label: "package_status", type: "select", required: true, options: ["noted", "at_stop", "in_transit", "delivered"], value: "in_transit" },
        { id: "source_ref", label: "source_ref", required: true, value: "fixture://shipment-package/1" }
      ],
      validate: (d) => {
        const code = (d.package_code || "").trim();
        const tok = (d.scan_token || "").trim();
        if (tok === `omni://shipment-package/${code}` || tok === `fixture://omni-qr/${code}`) return "";
        return "409 · skan wymaga QR Omni. EAN / obcy kod nie podpina zlecenia.";
      },
      onSave: () => toast("Skan QR Omni w sesji. Stop z trasy. Nie WMS.")
    });
    return;
  }
  if (a === "ship-containers") {
    OR_KERNEL.detail({
      title: "container · T3",
      note: "ISO 6346 + iso_size_type. Cyfrę kontrolną liczy serwer. Nie VGM.",
      rows: SHIP_META.containers.map((c) => ({ k: c.no, v: `iso_size_type ${c.iso}` })),
      actions: [{ act: "container-add", label: "Dodaj kontener" }]
    });
    return;
  }
  if (a === "container-add") {
    OR_KERNEL.form({
      title: "Kontener ISO 6346",
      note: "11 znaków. Cyfrę kontrolną liczy serwer, nie UI.",
      requireSource: true,
      fields: [
        { id: "container_no", label: "container_no", required: true, value: "MSKU7823410" },
        { id: "iso_size_type", label: "iso_size_type", required: true, value: "45G1" },
        { id: "source_ref", label: "source_ref", required: true, value: "fixture://container/3" }
      ],
      validate: (d) => (d.container_no || "").replace(/\s/g, "").length === 11 ? "" : "409 · container_no musi mieć 11 znaków ISO 6346.",
      onSave: () => toast("Kontener w sesji. Nie VGM.")
    });
    return;
  }
  if (a === "ship-air") {
    OR_KERNEL.form({
      title: "Odcinek air · U3",
      note: "leg_kind=air. Port bez airport w function_flags = odrzut. Nie HAWB.",
      requireSource: true,
      fields: [
        { id: "origin", label: "origin UN/LOCODE", required: true, value: "PLWAW" },
        { id: "destination", label: "destination UN/LOCODE", required: true, value: "PELIM" },
        { id: "source_ref", label: "source_ref", required: true, value: "fixture://shipment-leg/air-1" }
      ],
      validate: (d) => {
        const o = PORTS.find((p) => p.code === (d.origin || "").toUpperCase());
        const t = PORTS.find((p) => p.code === (d.destination || "").toUpperCase());
        if (!o || !o.airport) return "409 · origin bez flagi airport.";
        if (!t || !t.airport) return "409 · destination bez flagi airport.";
        return "";
      },
      onSave: () => toast("Odcinek air w sesji. Nie HAWB.")
    });
    return;
  }
  if (a === "new-groupage") {
    OR_KERNEL.form({
      title: "groupage_line · D1",
      note: "Dwa location. cutoff_local dana. transit_days ≥ 1. ISODOW 1=poniedziałek. Nie WMS.",
      requireSource: true,
      fields: [
        { id: "line_code", label: "line_code", required: true, value: "poz_waw_ltl" },
        { id: "origin", label: "origin location", required: true, value: "Poznań · magazyn" },
        { id: "dest", label: "destination location", required: true, value: "Warszawa · strefa" },
        { id: "cutoff_local", label: "cutoff_local", required: true, value: "16:00" },
        { id: "transit_days", label: "transit_days", required: true, value: "1" },
        { id: "operating_dows", label: "operating_dows", required: true, value: "1,2,3,4,5" },
        { id: "source_ref", label: "source_ref", required: true, value: "fixture://groupage-line/1" }
      ],
      validate: (d) => d.origin === d.dest ? "409 · origin i destination muszą być różne." : "",
      onSave: () => toast("Linia drobnicy w sesji. Nie WMS.")
    });
    return;
  }
  if (a === "cal-working-home") {
    OR_KERNEL.blocked("is_working_day = false · PL 2026-11-11 · day_kind holiday. Wynik z SQL, nie z JS. Nie V5.");
    return;
  }
  if (a === "open-mail") {
    quoteOpenMail = true;
    if (current === "quote") paintQuote();
    else go("quote");
    return;
  }
  if (a === "new-member") {
    OR_KERNEL.form({
      title: "Dodaj członka",
      note: "network_member.party_id obowiązkowy. Kopia per tenant, nie scraping.",
      fields: [
        { id: "code", label: "Kod członka", required: true, value: "agent_a", placeholder: "agent_a" },
        { id: "name", label: "Nazwa", required: true, placeholder: "Agent Alpha" },
        { id: "party_id", label: "Kontrahent członka", required: true, placeholder: "party_id" }
      ],
      onSave: () => toast("Członek w sesji. Bez party_id rekord nie wchodzi.")
    });
    return;
  }
  if (a === "ask-batch") {
    OR_KERNEL.confirm({
      title: "Paczka zapytań",
      note: "queued: jeden, wielu albo wszyscy. Nie wysyłka.",
      text: `Zaznacz top N (${inquiryDefaultN}): ${INQUIRIES.slice(0, inquiryDefaultN).map((i) => i.member).join(", ")} · POL PLGDY · POD PECLL.`,
      acceptLabel: "Zapisz paczkę zapytań",
      onAccept: () => toast("Paczka queued w sesji. Statusy: queued. Kwota tylko po answered.")
    });
    return;
  }
  if (a === "inquiry-drafts") {
    OR_KERNEL.mail({
      title: "Szkice zapytań · top N",
      to: "desk@andescargo.pe, desk@pacific-fw.com",
      subject: `RFQ lane PLGDY→PECLL · ${inquiryDefaultN} szkiców`,
      body: `Szkice zapytań: top ${inquiryDefaultN} z rankingu answered (inquiry_default_n). Nie wysyłka automatyczna.`,
      onSend: () => toast("N × mail_draft w sesji. Ranking z SQL.")
    });
    return;
  }
  if (a === "no-reply") {
    OR_KERNEL.confirm({
      title: "Notice ciszy",
      note: "no_reply_after minął. Operator wystawia notice ręcznie.",
      text: "Rotterdam Hub BV · no_reply_after 2026-09-05 · status no_reply. Zapisać operator_notice?",
      acceptLabel: "Zapisz notice",
      onAccept: () => toast("Notice ciszy w sesji. Nie auto-send.")
    });
    return;
  }
  if (a === "edit-user") {
    OR_KERNEL.form({
      title: "Rola OpenFGA",
      note: "Brak relacji = ukryj akcję. Nie zgadujemy uprawnień.",
      fields: [
        { id: "email", label: "Email", required: true, value: "anna@spedbaltyk.pl" },
        { id: "role", label: "Rola", type: "select", options: ["reviewer", "member", "admin"], value: "reviewer" }
      ],
      onSave: () => toast("Relacja FGA w sesji makiety.")
    });
    return;
  }

});
document.addEventListener("click", (e) => {
  if (e.target.closest("#railToggle")) {
    const on = !document.querySelector(".app").classList.contains("rail-open");
    document.querySelector(".app").classList.toggle("rail-open", on);
    $("#railToggle").setAttribute("aria-expanded", String(on));
    $("#railToggle").title = on ? "Zwiń menu" : "Rozwiń menu";
    try { localStorage.setItem("or-rail-open", on ? "1" : "0"); } catch (_e) { /* makieta */ }
    return;
  }
  if (e.target.closest("#sendQuote")) { OR_KERNEL.blocked("Wysyłka zablokowana: brak kodu HS. Nie omijamy walidacji ani HITL."); return; }
  if (e.target.closest("#acceptHitl")) {
    const cq = hitlDraftKind === "carrier_quote";
    OR_KERNEL.confirm({
      title: cq ? "Accept · carrier_quote" : "Accept szkicu",
      note: cq
        ? "Jedna transakcja. ExtractionService nie importuje channel_quotes z serwisu — zapis po Accept w warstwie API."
        : "Jedna transakcja. ExtractionService nie importuje rates.",
      text: cq
        ? "Zaznaczone pola wejdą do channel_quote (party, POL/POD, dzień, kwota). Nie rate_line."
        : "Zaznaczone kandydaty wejdą do rate_line. PDF zostaje jako source_ref.",
      onAccept: () => toast(cq ? "Accept → channel_quote w sesji. Nie rate_line." : "Accept → rate_line w sesji. Nie produkcja.")
    });
    return;
  }
  if (e.target.closest("#rejectHitl")) {
    OR_KERNEL.form({
      title: "Odrzuć szkic",
      note: "PDF zostaje. rate_line nie powstaje.",
      fields: [{ id: "reason", label: "Powód", required: true, type: "textarea" }],
      saveLabel: "Odrzuć",
      onSave: () => toast("Szkic odrzucony z powodem.")
    });
    return;
  }
  if (e.target.closest("#gk")) { gridDense = !gridDense; paintRates(); }
});
document.addEventListener("change", (e) => {
  if (e.target.id === "shipCustoms") {
    shipCustomsMode = e.target.value;
    if (current === "ship") setInsp(shipInspHtml(), true);
    toast(shipCustomsMode === "none" ? "Nie składamy pakietu celnego." : `Odbiorca pakietu: ${shipCustomsMode}.`);
  }
  if (e.target.id === "mailGroupBy") {
    mailGroupBy = e.target.value;
    if (current === "quote") {
      quoteOpenMail = true;
      paintQuote();
    }
  }
  if (e.target.id === "hitlKind") {
    hitlDraftKind = e.target.value;
    if (current === "hitl") paintHitl();
  }
  if (e.target.id === "netCountry") {
    netCountry = e.target.value;
    if (current === "networks") paintNetworks();
  }
});
$("#tenant").addEventListener("change", (e) => {
  $("#tenantInitials").textContent = e.target.value.split(" ").map((w) => w[0]).join("").slice(0, 2).toUpperCase();
  toast("Zmiana organizacji przeładowuje dane przez RLS. Żadne zapytanie nie łączy tenantów.");
});
$("#dc").addEventListener("click", () => { document.documentElement.dataset.density = "compact"; $("#dc").ariaPressed = "true"; $("#dr").ariaPressed = "false"; });
$("#dr").addEventListener("click", () => { document.documentElement.dataset.density = "comfortable"; $("#dr").ariaPressed = "true"; $("#dc").ariaPressed = "false"; });
$("#th").addEventListener("click", () => {
  const dark = document.documentElement.dataset.theme !== "dark";
  document.documentElement.dataset.theme = dark ? "dark" : "light";
  $("#th").textContent = dark ? "Motyw jasny" : "Motyw ciemny";
  $("#th").ariaPressed = String(dark);
});
$("#dsearch").addEventListener("input", (e) => paintDrawer(e.target.value));
$("#palIn").addEventListener("input", (e) => drawPal(e.target.value));
$("#scrim").addEventListener("click", (e) => { if (e.target === $("#scrim")) pal(false); });
$("#viewScrim").addEventListener("click", (e) => { if (e.target === $("#viewScrim")) { if (window.OR_KERNEL) OR_KERNEL.close(); else closeShipHeaderEditor(); } });
$("#navBack").addEventListener("click", goBack);
addEventListener("keydown", (e) => {
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k") { e.preventDefault(); pal(true); }
  if (e.altKey && e.key === "ArrowLeft") { e.preventDefault(); goBack(); }
  if (e.key === "Escape") { pal(false); setDrawer(false); if (window.OR_KERNEL) OR_KERNEL.close(); else closeShipHeaderEditor(); }
});
try {
  if (localStorage.getItem("or-rail-open") === "1") {
    document.querySelector(".app").classList.add("rail-open");
    $("#railToggle")?.setAttribute("aria-expanded", "true");
  }
} catch (_e) { /* makieta */ }
paintDrawer("");
applyView("home");
syncBackBtn();
</script>
