# Extraction prompt smoke — echo provider, bez żywego LLM (plaster 0.10)

# Lokalnie: `just promptfoo` = pytest fixture’e (ten sam dokument co vars poniżej).
# CI: `npx promptfoo@0.114.3 eval` na tym pliku (echo, nie OpenAI).

prompts:
  - |
    Extract freight charges from:
    {{document}}
    Return JSON with source_ref, unparsed_regions, candidates[{code,amount_text,currency}].

providers:
  - id: echo
    config:
      text: '{"source_ref":"doc://promptfoo/thc","unparsed_regions":[],"candidates":[{"code":"THC","amount_text":"100","currency":"EUR"}]}'

tests:
  - vars:
      document: "THC 100 EUR"
    assert:
      - type: is-json
      - type: javascript
        value: |
          const o = JSON.parse(output);
          return typeof o.source_ref === "string"
            && Array.isArray(o.unparsed_regions)
            && Array.isArray(o.candidates)
            && o.candidates.every((c) => c.code && c.amount_text && c.currency);
  - vars:
      document: "BAF 12 USD; weekend note"
    assert:
      - type: is-json
