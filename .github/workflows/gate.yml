# Bootstrap gate: agent-refs only until Phase B (pyproject + ruff/mypy/pytest).
# Branch protection on main should require this check once green.
name: gate

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: extractions/setup-just@v2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run quality gate
        run: just gate
