name: gate

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: omniroute
          POSTGRES_PASSWORD: omniroute
          POSTGRES_DB: omniroute
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U omniroute -d omniroute"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+asyncpg://omniroute:omniroute@localhost:5432/omniroute
      DATABASE_URL_SYNC: postgresql://omniroute:omniroute@localhost:5432/omniroute
      TEST_DATABASE_URL: postgresql+asyncpg://omniroute:omniroute@localhost:5432/omniroute_test
      ADMIN_TEST_DATABASE_URL: postgresql+asyncpg://omniroute:omniroute@localhost:5432/omniroute_test
      TENANT_TEST_DATABASE_URL: postgresql+asyncpg://tenant_tester:test@localhost:5432/omniroute_test
      OPENFGA_API_URL: http://localhost:8080

    steps:
      - uses: actions/checkout@v4

      - uses: extractions/setup-just@v2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Init test database
        run: |
          PGPASSWORD=omniroute psql -h localhost -U omniroute -d postgres -c "CREATE DATABASE omniroute_test;"

      - name: Start OpenFGA
        run: |
          docker run -d --name openfga -p 8080:8080 openfga/openfga:v1.8.13 run
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080/healthz >/dev/null; then
              echo "OpenFGA ready"
              exit 0
            fi
            sleep 1
          done
          docker logs openfga || true
          exit 1

      - name: Run migrations
        run: just migrate

      - name: Run quality gate
        run: just gate

      - name: Run integration tests
        run: just test-integration
