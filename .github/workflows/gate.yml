name: gate

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: omniroute
          POSTGRES_PASSWORD: omniroute
          POSTGRES_DB: omniroute
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U omniroute -d omniroute"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+asyncpg://omniroute_app:omniroute@localhost:5432/omniroute
      DATABASE_URL_SYNC: postgresql://omniroute:omniroute@localhost:5432/omniroute
      TEST_DATABASE_URL: postgresql+asyncpg://omniroute:omniroute@localhost:5432/omniroute_test
      ADMIN_TEST_DATABASE_URL: postgresql+asyncpg://omniroute:omniroute@localhost:5432/omniroute_test
      TENANT_TEST_DATABASE_URL: postgresql+asyncpg://tenant_tester:test@localhost:5432/omniroute_test
      OPENFGA_API_URL: http://localhost:8080
      JWT_SECRET: ${{ secrets.JWT_SECRET }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: extractions/setup-just@dd310ad5a97d8e7b41793f8ef055398d51ad4de6 # v2

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 10

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Init test database
        run: |
          PGPASSWORD=omniroute psql -h localhost -U omniroute -d postgres -c "CREATE DATABASE omniroute_test;"

      - name: Start OpenFGA
        run: |
          docker run -d --name openfga -p 8080:8080 openfga/openfga:v1.8.13 run
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080/healthz >/dev/null; then
              echo "OpenFGA ready"
              exit 0
            fi
            sleep 1
          done
          docker logs openfga || true
          exit 1

      - name: Run migrations
        run: just migrate

      - name: Run code gate
        run: just code-gate

      - name: pip-audit project dependencies
        run: just audit

      - name: Promptfoo schema smoke (echo, no live LLM)
        run: just promptfoo

      - name: Run integration tests
        run: just test-integration

  # Osobny job, bo w oknie #79-#88 meta-checki padały jako pierwsze w jednym
  # przebiegu i przykrywały wynik ruffa, mypy, testów oraz import-lintera.
  # Rozdzielone jobs raportują niezależnie, a ten nie potrzebuje PG, OpenFGA ani pnpm.
  meta:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: extractions/setup-just@dd310ad5a97d8e7b41793f8ef055398d51ad4de6 # v2

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Run meta gate
        run: just meta-gate
