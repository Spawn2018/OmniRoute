services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: omniroute
      POSTGRES_PASSWORD: omniroute
      POSTGRES_DB: omniroute
    ports:
      - "5432:5432"
    volumes:
      - omniroute_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U omniroute -d omniroute"]
      interval: 5s
      timeout: 5s
      retries: 5

  openfga:
    image: openfga/openfga:v1.8.13
    command: ["run"]
    ports:
      - "8080:8080"
      - "3000:3000"
    environment:
      OPENFGA_PLAYGROUND_ENABLED: "true"
    healthcheck:
      test: ["CMD", "/usr/local/bin/grpc_health_probe", "-addr=localhost:8081"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  omniroute_pg:
